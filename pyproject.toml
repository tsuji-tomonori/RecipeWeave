[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".dev-standard/",
  ".moon/",
  "outputs/",
  "data/generated/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
