[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "backend"]

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.13",
  "mypy>=1.15,<2",
  "pyright>=1.1.400,<2",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "boto3-stubs[dsql]>=1.40,<2",
  "sqlglot>=27,<31",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".dev-standard/",
  ".moon/",
  "outputs/",
  "data/generated/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests", "backend/tests"]
addopts = "--strict-config --strict-markers"
