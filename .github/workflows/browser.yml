name: Browser integration

on:
  push:
    branches: [dev, feat/service-receipts-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: recipeweave_owner
          POSTGRES_PASSWORD: recipeweave-local
          POSTGRES_DB: recipeweave_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipeweave_owner -d recipeweave_browser"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://recipeweave_owner:recipeweave-local@127.0.0.1:5432/recipeweave_browser
      DATABASE_URL: postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave_browser
      AUTH_MODE: local
      ENVIRONMENT: test
      LOCAL_AUTH_SECRET: recipeweave-ci-only-secret-32-characters-minimum
      LOCAL_AUTH_PASSWORD: recipeweave-local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: ブラウザ結合に必要な固定依存を導入する
        run: |
          uv sync --locked --all-packages
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          node frontend/scripts/prepare-ocr.mjs
      - name: 専用の実DBへ移行と初期データを適用する
        run: uv run --locked python tools/start_database.py
      - name: 本物のAPIと画面を起動する
        run: |
          mkdir -p reports
          uv run --locked --package recipeweave-api uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > reports/api.log 2>&1 &
          VITE_AUTH_MODE=local npm --prefix frontend run dev -- --host 127.0.0.1 > reports/frontend.log 2>&1 &
          uv run --locked python tools/wait_services.py
      - name: PCとモバイルの全ブラウザシナリオ
        id: e2e
        run: npm --prefix frontend run test:e2e
      - name: 失敗時のAPIと画面状態を認証情報を除いて記録する
        if: failure() && !cancelled()
        run: uv run --locked python tools/browser_diagnostics.py
      - name: ブラウザの全証跡を保存する
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-evidence
          path: |
            reports/
            frontend/test-results/
            frontend/playwright-report/
