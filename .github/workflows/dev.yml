name: Verify and publish Dev Pages

on:
  push:
    branches: [main, feat/service-receipts-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipeweave-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            infra/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-packages
          npm ci
          npm ci --prefix frontend
          npm ci --prefix infra
      - name: Verify canonical requirements
        run: |
          uv run --locked python tools/quintflow.py setup
          uv run --locked python tools/quintflow.py check
      - name: Generate API and SQL contracts
        run: uv run --locked --package recipeweave-api app-docs
      - name: Frontend types, domain tests and build
        run: |
          npm run check --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python tools/check_service_docs.py frontend/dist/help
      - name: Python lint, API architecture and strict types
        run: |
          uv run --locked ruff check packages/generator tools/generate_service_design.py
          uv run --locked ruff format --check backend database
          uv run --locked ruff check backend database
          uv run --locked --package recipeweave-api app-archlint
          uv run --locked pyright --project backend/pyproject.toml
          uv run --locked mypy --config-file backend/pyproject.toml backend/src backend/tests backend/tools database
      - name: Python tests
        run: |
          uv run --locked pytest packages/generator/tests -q
          uv run --locked pytest backend/tests --cov=app --cov-branch --cov-report=term-missing -q
      - name: Build actual Lambda asset
        run: uv run --locked --package recipeweave-api python backend/tools/package_lambda.py --architecture x86_64
      - name: CDK structural checks and synth
        run: |
          npm run check --prefix infra
          npm run synth --prefix infra
      - name: Generate and verify as-built design
        run: |
          uv run --locked --package recipeweave-api app-docs --check
          uv run --locked python -m recipeweave_generator.design
          uv run --locked python tools/generate_service_design.py
          uv run --locked python tools/generate_service_design.py --check
          python tools/check_generated_service.py
      - name: Preserve generated design for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implementation-design
          path: |
            backend/openapi.gen.json
            backend/src/app/apis/state/*/generated/*.py
            docs/design/generated/
            infra/cdk.out/*.template.json
          if-no-files-found: warn
      - name: Package Dev site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: frontend/dist

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Publish verified Dev site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
