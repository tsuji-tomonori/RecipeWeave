name: Verify and publish Dev Pages

on:
  push:
    branches: [dev, feat/service-receipts-dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipeweave-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: recipeweave_owner
          POSTGRES_PASSWORD: recipeweave-local
          POSTGRES_DB: recipeweave
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipeweave_owner -d recipeweave"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_PYTHON: '3.12'
      MIGRATION_DATABASE_URL: postgresql://recipeweave_owner:recipeweave-local@127.0.0.1:5432/recipeweave
      DATABASE_URL: postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave
      TEST_DATABASE_URL: postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave
      AUTH_MODE: local
      ENVIRONMENT: test
      LOCAL_AUTH_SECRET: recipeweave-ci-only-secret-32-characters-minimum
      LOCAL_AUTH_PASSWORD: recipeweave-local
      DOCS_BASE: /RecipeWeave/quality/design
      SQLFLUFF_OUTPUT: reports/sqlfluff.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            infra/package-lock.json
            documentation/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.11.33'
          enable-cache: true
      - name: 固定依存を導入する
        run: |
          uv sync --locked --all-packages
          npm ci
          npm ci --prefix frontend
          npm ci --prefix infra
          npm ci --prefix documentation
          uv run --locked python tools/quintflow.py setup
          npx --prefix frontend playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 実DB移行と非管理者ロール・初期データ
        run: uv run --locked python tools/start_database.py
      - name: 配備用ビルドと実装由来設計を生成する
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
          VITE_AUTH_MODE: cognito
          VITE_CATALOG_PREVIEW: "true"
          VITE_COGNITO_DOMAIN: ${{ vars.DEV_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.DEV_COGNITO_CLIENT_ID }}
          AWS_DEPLOY_CONFIGURED: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
          PRODUCTION_CALLBACK_CONFIGURED: ${{ vars.PRODUCTION_WEB_CALLBACK_URL != '' }}
        run: |
          mkdir -p reports
          uv run --locked python tools/deployment_readiness.py
          uv run --locked --package recipeweave-api app-docs
          npm run build --prefix frontend
          uv run --locked --package recipeweave-api python backend/tools/package_lambda.py --architecture x86_64 --verify-reproducible
          npm run synth --prefix infra
          uv run --locked python -m recipeweave_generator.design
          uv run --locked python tools/generate_service_design.py
      - name: 型・静的解析・単体・実DB・生成決定性
        id: quality
        continue-on-error: true
        run: uv run --locked python tools/quality.py
      - name: 本物のAPIと画面を起動する
        run: |
          uv run --locked python tools/prepare_e2e_database.py
          DATABASE_URL=postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave_e2e uv run --locked --package recipeweave-api uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > reports/api.log 2>&1 &
          VITE_AUTH_MODE=local npm --prefix frontend run dev -- --host 127.0.0.1 > reports/frontend.log 2>&1 &
          uv run --locked python tools/wait_services.py
      - name: Given When Then と画面証跡
        id: e2e
        continue-on-error: true
        run: npm --prefix frontend run test:e2e
      - name: ブラウザ失敗のAPIと画面状態を安全に記録する
        if: always() && !cancelled() && (failure() || steps.e2e.outcome == 'failure')
        run: uv run --locked python tools/browser_diagnostics.py
      - name: 証跡付き品質レポート
        id: report
        if: always() && !cancelled()
        continue-on-error: true
        run: uv run --locked python tools/report.py
      - name: 検索可能な設計書とSwagger
        id: documentation
        if: always() && !cancelled()
        continue-on-error: true
        run: uv run --locked python tools/docs_site.py
      - name: 品質サイトの表示・検索・図・画像拡大を確認する
        id: report_ui
        if: always() && !cancelled()
        continue-on-error: true
        env:
          QUALITY_BASE_URL: http://127.0.0.1:4174/RecipeWeave/quality
        run: |
          mkdir -p build/report-preview/RecipeWeave/quality
          cp -R reports/. build/report-preview/RecipeWeave/quality/
          python -m http.server 4174 --bind 127.0.0.1 --directory build/report-preview > reports/report-server.log 2>&1 &
          npm --prefix frontend run test:quality
      - name: 品質サイトの検証結果をレポートへ反映する
        if: always() && !cancelled()
        run: uv run --locked python tools/report.py
      - name: 検証後の実装と生成物がGitと一致することを確認する
        id: clean_tree
        if: always() && !cancelled()
        continue-on-error: true
        run: git diff --quiet HEAD --
      - name: 成果物と品質証跡を保存する
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implementation-and-quality
          path: |
            backend/openapi.gen.json
            docs/design/generated/
            infra/cdk.out/*.template.json
            backend/.build/lambda-manifest.gen.json
            reports/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
      - name: 必須検査をすべて要求する
        if: always()
        env:
          QUALITY: ${{ steps.quality.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          REPORT: ${{ steps.report.outcome }}
          DOCUMENTATION: ${{ steps.documentation.outcome }}
          REPORT_UI: ${{ steps.report_ui.outcome }}
          CLEAN_TREE: ${{ steps.clean_tree.outcome }}
        run: test "$QUALITY" = success && test "$E2E" = success && test "$REPORT" = success && test "$DOCUMENTATION" = success && test "$REPORT_UI" = success && test "$CLEAN_TREE" = success
      - name: 検証したコミットとツリーを記録する
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p build
          git diff --quiet
          python tools/verified_revision.py --write build/verified-revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        with:
          name: verified-revision
          path: build/verified-revision.txt
          retention-days: 90
      - name: Pages用にアプリと品質レポートをまとめる
        run: |
          mkdir -p frontend/dist/quality
          cp -R reports/. frontend/dist/quality/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: frontend/dist

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: 検証済みのアプリと品質証跡を公開する
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
