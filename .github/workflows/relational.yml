name: PostgreSQL integration

on:
  push:
    branches: [dev, feat/service-receipts-dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relational-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: recipeweave_owner
          POSTGRES_PASSWORD: recipeweave-local
          POSTGRES_DB: recipeweave
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipeweave_owner -d recipeweave"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://recipeweave_owner:recipeweave-local@127.0.0.1:5432/recipeweave
      DATABASE_URL: postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave
      TEST_DATABASE_URL: postgresql://recipeweave_app:recipeweave-local@127.0.0.1:5432/recipeweave
      AUTH_MODE: local
      ENVIRONMENT: test
      LOCAL_AUTH_SECRET: recipeweave-ci-only-secret-32-characters-minimum
      LOCAL_AUTH_PASSWORD: recipeweave-local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: 固定依存の導入
        run: uv sync --locked --all-packages
      - name: 管理者の移行と非管理者の実行ロール
        run: |
          DATABASE_URL="$MIGRATION_DATABASE_URL" uv run --locked python database/migrate.py --apply
          uv run --locked python tools/local_database.py
          uv run --locked python -m database.seed
      - name: 実PostgreSQLの参照・制約・所有権・CRUD
        run: |
          mkdir -p reports
          uv run --locked pytest tests/test_relational_schema.py backend/tests/test_catalog_database.py backend/tests/test_seed_catalog.py backend/tests/test_entity_api_db.py --junitxml=reports/relational-junit.xml -q
          uv run --locked python tools/require_executed_tests.py reports/relational-junit.xml
      - name: 実DB試験の証跡
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relational-evidence
          path: reports/
